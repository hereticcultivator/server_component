server:
  port: 9999

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/comeon_db?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&useUnicode=true
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 连接池配置
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  # Jackson 配置（确保使用 snake_case）
  jackson:
    property-naming-strategy: SNAKE_CASE

# MyBatis 配置
mybatis:
  # Mapper XML 文件位置
  mapper-locations: classpath:mapper/*.xml
  # 实体类别名包路径
  type-aliases-package: com.comeon.component.model
  # MyBatis 配置
  configuration:
    map-underscore-to-camel-case: true  # 开启驼峰命名转换
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 打印 SQL（开发环境）

# JWT Token 配置
jwt:
  secret: hahaha-your-secret-key-minimum-32-characters-long-for-security
  access-token-expiration: 3600000  # AccessToken 有效期：1小时（毫秒）
  refresh-token-expiration: 604800000  # RefreshToken 有效期：7天（毫秒）